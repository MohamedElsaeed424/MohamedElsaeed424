<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="From business problem to AI in production"><title>From business problem to AI in production</title><style>@font-face{font-family:IN500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:none;font-variant-ligatures:none}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.in{animation:in 1s ease-out both}
.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
.draw{animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift2 19s ease-in-out infinite alternate}
.float{animation:float 4.5s ease-in-out infinite alternate}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3s ease-in-out infinite}
.blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.caret{animation:caret 1s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-46px,22px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(40px,-18px)}}
@keyframes float{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.4)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.42)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

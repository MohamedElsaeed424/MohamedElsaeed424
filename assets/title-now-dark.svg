<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="78" viewBox="0 0 1000 78" role="img" aria-label="Now"><title>Now</title><style>@font-face{font-family:IN400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:SG700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-kerning:none;font-variant-ligatures:none}
.up{animation:up .8s cubic-bezier(.2,.7,.2,1) both}
.in{animation:in 1s ease-out both}
.pop{animation:pop .6s cubic-bezier(.3,1.5,.5,1) both;transform-box:fill-box;transform-origin:center}
.draw{animation:draw 1.6s cubic-bezier(.6,0,.2,1) both}
.drift{animation:drift 16s ease-in-out infinite alternate}
.drift2{animation:drift2 19s ease-in-out infinite alternate}
.float{animation:float 4.5s ease-in-out infinite alternate}
.pulse{animation:pulse 2.4s ease-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 2.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
.breathe{animation:breathe 3s ease-in-out infinite}
.blink{animation:blink 5.5s infinite;transform-box:fill-box;transform-origin:center}
.caret{animation:caret 1s steps(1) infinite}
.flow{animation:flow 1.6s linear infinite}
.spin{animation:spin 60s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-46px,22px)}}
@keyframes drift2{from{transform:translate(0,0)}to{transform:translate(40px,-18px)}}
@keyframes float{from{transform:translateY(-5px)}to{transform:translateY(6px)}}
@keyframes pulse{0%{opacity:.75;transform:scale(1)}80%,100%{opacity:0;transform:scale(2.4)}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}70%,100%{opacity:0;transform:scale(1.42)}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes caret{0%{opacity:1}50%{opacity:0}}
@keyframes flow{to{stroke-dashoffset:-20}}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#45d3c7"/><stop offset="1" stop-color="#f4c56f"/></linearGradient></defs><text x="0" y="50" font-family="SG700,'Segoe UI', Arial, sans-serif" font-weight="700" font-size="44" fill="none" stroke="#18a9a3" stroke-width="1.3">01</text><g class="up"><text x="74" y="38" font-family="SG700,'Segoe UI', Arial, sans-serif" font-weight="700" font-size="27" fill="#ecf4f3" >Now</text></g><g class="up" style="animation-delay:0.12s"><text x="75" y="64" font-family="IN400,'Segoe UI', Arial, sans-serif" font-weight="400" font-size="15.5" fill="#7f969b" >What I am building and writing right now</text></g><line x1="151.78" y1="29" x2="974" y2="29" stroke="#1d3c44" stroke-width="1.5"/><line class="draw" x1="151.78" y1="29" x2="974" y2="29" stroke="url(#g1)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="822.22" style="--len:822.22"/><g class="pop" style="animation-delay:1.3s"><rect x="983" y="24" width="10" height="10" rx="1.5" fill="#f4c56f" transform="rotate(45 988 29)" /></g><circle class="pulse" cx="988" cy="29" r="6" fill="none" stroke="#f4c56f" style="animation-delay:1.6s"/></svg>
# Draws the live parts of the profile README every day: the Activity card (from the contribution calendar) and the
# contribution snake. Both go to the `output` branch, so `main` only ever holds what the LinkedIn planner wrote.
# Written by the LinkedIn planner from templates/github/profile-assets.yml: edit it there, not here.
name: Profile assets

on:
  schedule:
    - cron: "17 3 * * *"   # every day at 03:17 UTC
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-assets
  cancel-in-progress: true

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Activity card
        run: python3 .github/scripts/activity.py dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#b8801c&color_dots=#ebe6da,#bfe3e1,#7cc9c4,#18a9a3,#0e7c86
            dist/snake-dark.svg?palette=github-dark&color_snake=#f4c56f&color_dots=#161b22,#0f4c50,#0e7c86,#18a9a3,#45d3c7

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Draw the profile activity card and snake
          jekyll: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
